name: validate
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun test
      # The 48h staleness gate is a property of main (did the scheduled
      # refresh silently break?), not of a proposed change. A discover PR is
      # meant to sit open for multi-day human review, so it must not fail
      # its own gate just for being old. Schema + reproducibility still run
      # either way.
      - if: github.event_name == 'pull_request'
        run: bun run src/cli.ts validate --no-staleness
      - if: github.event_name != 'pull_request'
        run: bun run src/cli.ts validate
